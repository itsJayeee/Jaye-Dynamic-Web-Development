  </main>

  <main id="gallery-view" class="hidden">
    <div style="display:flex;align-items:center;gap:12px;">
      <h2 style="margin:0;">My Saved Routes</h2>
      <button id="btn-back">Back to Editor</button>
    </div>
    <div id="routes-grid"></div>

  <script>
    // ===== CONFIG =====
    const GRID_SIZE = 40; // keep in sync with CSS background-size
    const wall = document.getElementById('wall-container');

    // Editor controls
    const rotInput = document.getElementById('input-rotation');
    const scaleInput = document.getElementById('input-scale');
    const rotVal = document.getElementById('rot-val');
    const scaleVal = document.getElementById('scale-val');
    const btnDelete = document.getElementById('btn-delete-hold');

    // Nav / views
    const btnEditor = document.getElementById('btn-editor');
    const btnGallery = document.getElementById('btn-gallery');
    const btnBack = document.getElementById('btn-back');
    const viewEditor = document.getElementById('editor-view');
    const viewGallery = document.getElementById('gallery-view');
    const grid = document.getElementById('routes-grid');

    // Save inputs
    const routeNameInput = document.getElementById('route-name');
    const btnSave = document.getElementById('btn-save');

    // State
    let selectedHold = null;

    // ===== DRAG FROM PALETTE -> CREATE HOLD =====
    document.querySelectorAll('.hold-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        e.dataTransfer.setData('type', item.dataset.type);
      });
    });

    wall.addEventListener('dragover', e => e.preventDefault());
    wall.addEventListener('drop', e => {
      e.preventDefault();
      const type = e.dataTransfer.getData('type');
      if (type) createHold(type, e.clientX, e.clientY);
    });

    function createHold(type, mouseX, mouseY) {
      const hold = document.createElement('div');
      hold.classList.add('wall-hold');
      hold.dataset.type = type;
      hold.dataset.rotation = 0;
      hold.dataset.scale = 1;

      const shape = document.createElement('div');
      shape.classList.add('hold-shape', `shape-${type}`);
      hold.appendChild(shape);

      // position snap
      const rect = wall.getBoundingClientRect();
      const rawX = mouseX - rect.left;
      const rawY = mouseY - rect.top;
      const snapX = Math.round(rawX / GRID_SIZE) * GRID_SIZE;
      const snapY = Math.round(rawY / GRID_SIZE) * GRID_SIZE;

      hold.style.left = snapX + 'px';
      hold.style.top = snapY + 'px';
      hold.dataset.x = snapX;
      hold.dataset.y = snapY;

      bindHoldInteractions(hold);
      wall.appendChild(hold);
      selectHold(hold);
    }

    // ===== SELECT / TRANSFORM / MOVE EXISTING =====
    function bindHoldInteractions(hold) {
      hold.addEventListener('mousedown', e => {
        e.stopPropagation();
        selectHold(hold);
        startDragExisting(hold, e);
      });
    }

    function selectHold(hold) {
      if (selectedHold) selectedHold.classList.remove('selected');
      selectedHold = hold;
      if (!selectedHold) return;
      selectedHold.classList.add('selected');
      rotInput.value = selectedHold.dataset.rotation;
      scaleInput.value = selectedHold.dataset.scale;
      rotVal.textContent = selectedHold.dataset.rotation;
      scaleVal.textContent = selectedHold.dataset.scale;
      applyTransform(selectedHold);
    }

    // drag an existing hold
    function startDragExisting(hold, downEvent) {
      const startX = downEvent.clientX;
      const startY = downEvent.clientY;
      const origX = parseFloat(hold.dataset.x) || 0;
      const origY = parseFloat(hold.dataset.y) || 0;

      function onMove(e) {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const rect = wall.getBoundingClientRect();
        const newX = Math.round((origX + dx) / GRID_SIZE) * GRID_SIZE;
        const newY = Math.round((origY + dy) / GRID_SIZE) * GRID_SIZE;

        hold.style.left = newX + 'px';
        hold.style.top = newY + 'px';
        hold.dataset.x = newX;
        hold.dataset.y = newY;
      }

      function onUp() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }

    // sliders
    rotInput.addEventListener('input', () => {
      if (!selectedHold) return;
      selectedHold.dataset.rotation = rotInput.value;
      rotVal.textContent = rotInput.value;
      applyTransform(selectedHold);
    });

    scaleInput.addEventListener('input', () => {
      if (!selectedHold) return;
      selectedHold.dataset.scale = scaleInput.value;
      scaleVal.textContent = scaleInput.value;
      applyTransform(selectedHold);
    });

    function applyTransform(hold) {
      const r = parseFloat(hold.dataset.rotation) || 0;
      const s = parseFloat(hold.dataset.scale) || 1;
      hold.style.transform = `translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
      // center visual: top/left are grid points, so use translate to center the shape
      hold.style.position = 'absolute';
    }

    // click empty wall to deselect
    wall.addEventListener('mousedown', () => selectHold(null));

    // delete selected
    btnDelete.addEventListener('click', () => {
      if (!selectedHold) return;
      selectedHold.remove();
      selectedHold = null;
    });

    // ===== SAVE (screenshot + html) =====
    async function captureThumbnail() {
      const canvas = await html2canvas(wall, { backgroundColor: '#ffffff', scale: 0.5 });
      return canvas.toDataURL('image/png');
    }

    btnSave.addEventListener('click', async () => {
      const name = (routeNameInput.value || 'Untitled').trim();

      // IMPORTANT: ensure all holds have up-to-date x/y/rotation/scale in dataset
      // (already kept in dataset on interaction)

      // 1) html snapshot (for restore)
      const html = wall.innerHTML;

      // 2) thumbnail
      const thumbnail = await captureThumbnail();

      // 3) send to server
      const res = await fetch('/api/routes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, html, thumbnail })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert('Save failed: ' + (err.error || res.statusText));
        return;
      }

      // small UX feedback
      btnSave.textContent = 'SAVED!';
      setTimeout(() => (btnSave.textContent = 'SAVE DESIGN'), 1200);

      // Go to gallery to view it
      openGallery();
    });

    // ===== GALLERY =====
    async function openGallery() {
      const res = await fetch('/api/routes');
      const list = await res.json().catch(() => []);
      grid.innerHTML = '';

      if (!list.length) {
        grid.innerHTML = '<p>No saved routes yet.</p>';
      } else {
        for (const item of list) {
          const card = document.createElement('div');
          card.className = 'route-card';
          card.style.cursor = 'pointer';
          card.innerHTML = `
            <img src="${item.thumbnail}" alt="${item.name}" class="route-thumbnail" style="width:100%;display:block;aspect-ratio:1/1;object-fit:contain;background:#111;border-radius:6px;" />
            <h3 style="margin-top:10px;">${item.name}</h3>
            <p style="opacity:.8;">ID: ${item.id}</p>
          `;
          card.addEventListener('click', () => loadDesign(item.id));
          grid.appendChild(card);
        }
      }

      // switch view
      viewEditor.classList.add('hidden');
      viewGallery.classList.remove('hidden');
      btnEditor.classList.remove('active');
      btnGallery.classList.add('active');
    }

    async function loadDesign(id) {
      const res = await fetch(`/api/routes/${id}`);
      if (!res.ok) return alert('Design not found');
      const data = await res.json();

      // restore html (holds and their datasets)
      wall.innerHTML = data.html;

      // rebind events for restored holds
      wall.querySelectorAll('.wall-hold').forEach(hold => {
        // ensure required dataset defaults
        hold.dataset.rotation = hold.dataset.rotation || '0';
        hold.dataset.scale = hold.dataset.scale || '1';
        hold.dataset.x = hold.dataset.x || parseFloat(hold.style.left) || 0;
        hold.dataset.y = hold.dataset.y || parseFloat(hold.style.top) || 0;

        bindHoldInteractions(hold);
        applyTransform(hold);
      });

      // switch back to editor
      viewGallery.classList.add('hidden');
      viewEditor.classList.remove('hidden');
      btnGallery.classList.remove('active');
      btnEditor.classList.add('active');
    }

    // nav events
    btnEditor.addEventListener('click', () => {
      viewEditor.classList.remove('hidden');
      viewGallery.classList.add('hidden');
      btnEditor.classList.add('active');
      btnGallery.classList.remove('active');
    });

    btnGallery.addEventListener('click', openGallery);
    btnBack.addEventListener('click', () => {
      viewGallery.classList.add('hidden');
      viewEditor.classList.remove('hidden');
      btnGallery.classList.remove('active');
      btnEditor.classList.add('active');
    });
  </script>

</body>
